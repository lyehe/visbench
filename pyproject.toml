[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visbench"
version = "0.1.0"
description = "Benchmark harness for visual feature matching: standardized datasets, methods, and reporting."
readme = "README.md"
requires-python = ">= 3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "visbench contributors" },
]
keywords = ["image matching", "benchmark", "feature matching", "homography", "pose estimation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
]

dependencies = [
  # Matchers come from vismatch, which declares its own model dependencies.
  "vismatch",
  "torch>=2.0",
  "opencv-python>=4.5.4",
  "numpy",
  "scipy",
  "pillow",
  "tqdm",
  # Dataset downloads / formats.
  "huggingface_hub>=0.22.0",
  "hf_transfer>=0.1.5",
  "gdown>=5.1.0",
  "py7zr",
  "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.14.5"]
# Aachen v1.1 reads its COLMAP model with pycolmap.
aachen = ["pycolmap"]
# romaxx:<kind> methods need RoMaXX installed in the same environment
# (it is not on PyPI; e.g. `uv pip install -e <path-to-romaxx>`).

[project.scripts]
visbench = "visbench.__main__:main"

[project.urls]
Homepage = "https://github.com/lyehe/visbench"

[tool.hatch.build.targets.wheel]
packages = ["visbench"]

[tool.hatch.build.targets.wheel.force-include]
"visbench/reference_scores.json" = "visbench/reference_scores.json"

[tool.uv.sources]
vismatch    = { path = "third_party/vismatch", editable = true }
torch       = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
exclude = ["third_party"]

[tool.ruff.lint]
ignore = ["E402", "E501"]
